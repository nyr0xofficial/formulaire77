<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Administration — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF0EA;
    --paper-card: #F8F9F5;
    --ink: #22333B;
    --ink-soft: #5B6B70;
    --rule: #C9CFC2;
    --leather: #8C5E3C;
    --moss: #5C7B6D;
    --error: #A3372E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 6rem;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 1.3rem;
    margin-bottom: 2.5rem;
  }

  .brand {
    font-family: 'Newsreader', serif;
    font-size: 1.7rem;
    font-weight: 500;
  }

  .brand em { color: var(--leather); font-style: italic; }

  .brand-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--leather);
    margin: 0 0 1.5rem;
  }

  .entries {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--rule);
  }

  .entry {
    display: grid;
    grid-template-columns: 3.4rem 1fr auto;
    gap: 1rem;
    align-items: start;
    padding: 1.1rem 0;
    border-bottom: 1px dashed var(--rule);
  }

  .entry-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--leather);
    padding-top: 0.15rem;
  }

  .entry-top {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 0.25rem;
  }

  .entry-name { font-family: 'Newsreader', serif; font-size: 1.05rem; }

  .entry-email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  .entry-msg { font-size: 0.92rem; line-height: 1.55; margin: 0; }

  .entry-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-soft);
    margin-top: 0.35rem;
  }

  .entry-delete {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .entry-delete:hover { color: var(--error); }

  .empty-state {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--ink-soft);
    padding: 2rem 0;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Administration — <em>messages</em></div>
      <form method="POST" action="/admin/logout">
        <button type="submit" style="font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; background: none; border: none; color: var(--ink-soft); text-decoration: underline; cursor: pointer;">se déconnecter</button>
      </form>
    </header>

    <p class="eyebrow" id="entries-count">Registre</p>
    <div class="entries" id="entries-list">
      <p class="empty-state">Chargement…</p>
    </div>
  </div>

<script>
const entriesList = document.getElementById('entries-list');
const entriesCount = document.getElementById('entries-count');

function formatDate(iso) {
  const d = new Date(iso + 'Z');
  return d.toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function loadEntries() {
  try {
    const res = await fetch('/api/messages');
    if (!res.ok) throw new Error('Accès refusé.');
    const rows = await res.json();
    entriesCount.textContent = 'Registre — ' + rows.length + (rows.length > 1 ? ' entrées' : ' entrée');

    if (rows.length === 0) {
      entriesList.innerHTML = '<p class="empty-state">Aucun message pour le moment.</p>';
      return;
    }

    entriesList.innerHTML = rows.map(r => `
      <div class="entry" data-id="${r.id}">
        <div class="entry-num">N&deg;${String(r.id).padStart(3, '0')}</div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-name">${escapeHtml(r.nom)}</span>
            <span class="entry-email">${escapeHtml(r.email)}</span>
          </div>
          <p class="entry-msg">${escapeHtml(r.message)}</p>
          <div class="entry-date">${formatDate(r.date_creation)}</div>
        </div>
        <button class="entry-delete" data-id="${r.id}">supprimer</button>
      </div>
    `).join('');

    entriesList.querySelectorAll('.entry-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        await fetch('/api/messages/' + btn.dataset.id, { method: 'DELETE' });
        loadEntries();
      });
    });
  } catch (err) {
    entriesList.innerHTML = '<p class="empty-state">Impossible de charger les messages.</p>';
  }
}

loadEntries();
</script>
</body>
</html>
