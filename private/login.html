<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF0EA;
    --paper-card: #F8F9F5;
    --ink: #22333B;
    --ink-soft: #5B6B70;
    --rule: #C9CFC2;
    --leather: #8C5E3C;
    --error: #A3372E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  .card { width: 100%; max-width: 360px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--leather);
    margin: 0 0 0.6rem;
  }
  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 1.6rem;
    margin: 0 0 1.8rem;
  }
  form { display: flex; flex-direction: column; gap: 1.2rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; }
  .field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .field input {
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    color: var(--ink);
    background: var(--paper-card);
    border: none;
    border-bottom: 1.5px solid var(--rule);
    padding: 0.65rem 0.1rem;
    outline: none;
  }
  .field input:focus { border-bottom-color: var(--leather); }
  .error-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--error);
    display: none;
  }
  .error-msg.visible { display: block; }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.85rem 1.6rem;
    cursor: pointer;
    margin-top: 0.3rem;
  }
  button:hover { background: var(--leather); }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Administration</p>
    <h1>Connexion</h1>
    <form method="POST" action="/admin/login">
      <div class="field">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <p class="error-msg" id="error-msg">Identifiant ou mot de passe incorrect.</p>
      <button type="submit">Se connecter</button>
    </form>
  </div>
<script>
  if (new URLSearchParams(window.location.search).get('error') === '1') {
    document.getElementById('error-msg').classList.add('visible');
  }
</script>
</body>
</html>
