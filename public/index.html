<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X - Connexion</title>
    <style>
        /* --- DESIGN X (Twitter) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            background-color: #121212;
            border-radius: 32px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #2f3336;
        }

        .x-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }

        .x-logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        .login-title {
            color: #e7e9ea;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: #71767b;
            font-size: 15px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #71767b;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1d9bf0;
            box-shadow: 0 0 0 2px rgba(29, 155, 240, 0.3);
            background-color: #000000;
        }

        .form-group input::placeholder {
            color: #71767b;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #1d9bf0;
            border: none;
            border-radius: 40px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            background-color: #1a8cd8;
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background-color: rgba(244, 33, 46, 0.1);
            border: 1px solid rgba(244, 33, 46, 0.3);
            color: #f4212e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
            backdrop-filter: blur(4px);
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .login-footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid #2f3336;
            padding-top: 20px;
        }

        .login-footer p {
            color: #71767b;
            font-size: 14px;
        }

        .login-footer a {
            color: #1d9bf0;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 16px;
                border-radius: 24px;
            }
            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <!-- Logo X -->
    <div class="x-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
    </div>

    <h1 class="login-title">Connexion</h1>
    <p class="login-subtitle">Connectez-vous à votre compte</p>

    <div id="error-message" class="error-message">
        <span id="error-text">⚠️ Identifiants incorrects. Veuillez réessayer.</span>
    </div>

    <!-- Formulaire - ENVOIE VERS LE VRAI BACKEND -->
    <form id="login-form">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="admin" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="login-btn" id="login-btn">Se connecter</button>
    </form>

    <!-- Liens factices (comme sur X) -->
    <div class="login-footer">
        <p>Pas encore de compte ? <a href="#">S'inscrire</a></p>
        <p style="margin-top: 8px; font-size: 12px; color: #54585d;">&copy; 2026 X Corp.</p>
        <p style="margin-top: 8px; font-size: 11px; color: #54585d;">
            <a href="#" style="color: #54585d; text-decoration: none;">Conditions</a> · 
            <a href="#" style="color: #54585d; text-decoration: none;">Confidentialité</a> · 
            <a href="#" style="color: #54585d; text-decoration: none;">Aide</a>
        </p>
    </div>
</div>

<script>
    // --- LIEN AVEC LE BACKEND EXISTANT (server.js) ---
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');

    // Messages d'erreur aléatoires (comme sur un vrai site)
    const errorMessages = [
        '❌ Identifiants incorrects. Veuillez réessayer.',
        '⚠️ Le nom d\'utilisateur ou le mot de passe est incorrect.',
        '🔒 Identifiants invalides. Vérifiez vos informations.',
        '⛔ Accès refusé. Veuillez vérifier vos identifiants.'
    ];

    function showRandomError() {
        const randomIndex = Math.floor(Math.random() * errorMessages.length);
        errorText.textContent = errorMessages[randomIndex];
        errorMessage.classList.add('show');
    }

    function resetButton() {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Se connecter';
    }

    // Soumission du formulaire - VERS /api/login (le vrai backend)
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span> Connexion...';
        errorMessage.classList.remove('show');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            errorText.textContent = '⚠️ Veuillez remplir tous les champs.';
            errorMessage.classList.add('show');
            resetButton();
            return;
        }

        try {
            // --- ENVOI VERS LA VRAIE ROUTE /api/login (server.js) ---
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                // ✅ SUCCÈS → REDIRECTION VERS LE VRAI PANEL ADMIN
                window.location.href = '/admin/dashboard';
            } else {
                // ❌ ÉCHEC → AFFICHAGE D'ERREUR
                showRandomError();
                resetButton();
            }
        } catch (error) {
            console.error('Login error:', error);
            errorText.textContent = '❌ Erreur réseau. Vérifiez votre connexion.';
            errorMessage.classList.add('show');
            resetButton();
        }
    });

    // --- EFFETS SPÉCIAUX (pour faire plus vrai) ---
    document.querySelectorAll('.login-footer a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const messages = [
                '😄 Ceci est une page de connexion X... ou pas.',
                '🔄 Redirection vers X... (non, c\'est un piège)',
                '🐦 Ce n\'est pas le vrai X. C\'est votre admin panel.',
                '🤫 Chut... C\'est un honeypot.'
            ];
            alert(messages[Math.floor(Math.random() * messages.length)]);
        });
    });

    document.getElementById('username').focus();

    // Log discret dans la console
    console.log('🔐 Page de connexion X (publique) - Backend admin actif');
    console.log('📡 Les identifiants sont envoyés à /api/login');
    console.log('🔑 Utilisez admin/changeme pour accéder au panel');
</script>

</body>
</html>
