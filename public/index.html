<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X - Contactez-nous</title>
    <style>
        /* --- DESIGN X (Twitter) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #121212;
            border-radius: 32px;
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #2f3336;
        }

        .x-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .x-logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        .form-title {
            color: #e7e9ea;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .form-subtitle {
            color: #71767b;
            font-size: 15px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #71767b;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background-color: #000000;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1d9bf0;
            box-shadow: 0 0 0 2px rgba(29, 155, 240, 0.3);
            background-color: #000000;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #71767b;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            max-height: 200px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1d9bf0;
            border: none;
            border-radius: 40px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            background-color: #1a8cd8;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }

        .response-message.success {
            display: block;
            background-color: rgba(0, 186, 124, 0.15);
            border: 1px solid rgba(0, 186, 124, 0.3);
            color: #00ba7c;
        }

        .response-message.error {
            display: block;
            background-color: rgba(244, 33, 46, 0.1);
            border: 1px solid rgba(244, 33, 46, 0.3);
            color: #f4212e;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .admin-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #2f3336;
        }

        .admin-link a {
            color: #54585d;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .admin-link a:hover {
            color: #71767b;
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 24px 16px;
                border-radius: 24px;
            }
            .form-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- Logo X -->
    <div class="x-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
    </div>

    <h1 class="form-title">Contactez-nous</h1>
    <p class="form-subtitle">Envoyez-nous un message, nous vous répondrons</p>

    <div id="response-message" class="response-message"></div>

    <form id="contact-form">
        <div class="form-group">
            <label for="name">Nom complet</label>
            <input type="text" id="name" name="name" placeholder="Jean Dupont" required />
        </div>
        <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" name="email" placeholder="jean@exemple.com" required />
        </div>
        <div class="form-group">
            <label for="message">Votre message</label>
            <textarea id="message" name="message" placeholder="Écrivez votre message ici..." required></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Envoyer</button>
    </form>

    <div class="admin-link">
        <a href="/admin">🔐 Accès administrateur</a>
    </div>
</div>

<script>
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const responseMessage = document.getElementById('response-message');

    function showMessage(text, type = 'success') {
        responseMessage.textContent = text;
        responseMessage.className = 'response-message ' + type;
        if (type === 'success') {
            setTimeout(() => {
                responseMessage.className = 'response-message';
            }, 5000);
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Envoi...';
        responseMessage.className = 'response-message';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!name || !email || !message) {
            showMessage('⚠️ Tous les champs sont obligatoires.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Envoyer';
            return;
        }

        try {
            const response = await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, message })
            });

            if (response.ok) {
                showMessage('✅ Message envoyé avec succès !', 'success');
                form.reset();
            } else {
                const data = await response.json();
                showMessage('❌ Erreur : ' + (data.error || 'Veuillez réessayer.'), 'error');
            }
        } catch (error) {
            console.error('Erreur réseau:', error);
            showMessage('❌ Erreur réseau. Vérifiez votre connexion.', 'error');
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Envoyer';
    });

    console.log('📝 Formulaire de contact X chargé');
    console.log('📡 Les données sont envoyées à /api/messages');
</script>

</body>
</html>
