<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nous contacter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF0EA;
    --paper-card: #F8F9F5;
    --ink: #22333B;
    --ink-soft: #5B6B70;
    --rule: #C9CFC2;
    --leather: #8C5E3C;
    --moss: #5C7B6D;
    --error: #A3372E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 460px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--leather);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 1.9rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 2.2rem;
    line-height: 1.5;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .field input,
  .field textarea {
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    color: var(--ink);
    background: var(--paper-card);
    border: none;
    border-bottom: 1.5px solid var(--rule);
    padding: 0.65rem 0.1rem;
    outline: none;
    transition: border-color 0.15s ease;
    resize: vertical;
  }

  .field textarea { min-height: 110px; line-height: 1.6; }

  .field input:focus,
  .field textarea:focus {
    border-bottom-color: var(--leather);
  }

  .field.invalid input,
  .field.invalid textarea {
    border-bottom-color: var(--error);
  }

  .field-error {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--error);
    min-height: 1em;
  }

  .submit-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.5rem;
  }

  button.submit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.85rem 1.6rem;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button.submit:hover { background: var(--leather); }
  button.submit:active { transform: scale(0.98); }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  .status-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--error);
  }

  /* --- Confirmation --- */
  .confirmation {
    display: none;
    text-align: center;
    padding: 2rem 0;
  }

  .confirmation.visible { display: block; }
  form.hidden { display: none; }

  .confirmation .mark {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--moss);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
  }

  .confirmation h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }

  .confirmation p {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 1.5rem;
    line-height: 1.5;
  }

  .confirmation button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Contact</p>
    <h1>Laissez-nous un message</h1>
    <p class="subtitle">Remplissez le formulaire ci-dessous, nous reviendrons vers vous rapidement.</p>

    <form id="msg-form" novalidate>
      <div class="field" id="field-nom">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Jeanne Dubois" autocomplete="name" />
        <span class="field-error" id="err-nom"></span>
      </div>

      <div class="field" id="field-email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jeanne@exemple.com" autocomplete="email" />
        <span class="field-error" id="err-email"></span>
      </div>

      <div class="field" id="field-message">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Votre message ici…"></textarea>
        <span class="field-error" id="err-message"></span>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit" id="submit-btn">Envoyer</button>
        <span class="status-msg" id="status-msg"></span>
      </div>
    </form>

    <div class="confirmation" id="confirmation">
      <div class="mark">✓</div>
      <h2>Message envoyé</h2>
      <p>Merci, votre message a bien été reçu.</p>
      <button id="reset-btn">Envoyer un autre message</button>
    </div>
  </div>

<script>
const form = document.getElementById('msg-form');
const submitBtn = document.getElementById('submit-btn');
const statusMsg = document.getElementById('status-msg');
const confirmation = document.getElementById('confirmation');
const resetBtn = document.getElementById('reset-btn');

const fields = ['nom', 'email', 'message'];

function clearErrors() {
  fields.forEach(f => {
    document.getElementById('field-' + f).classList.remove('invalid');
    document.getElementById('err-' + f).textContent = '';
  });
}

function setError(field, text) {
  document.getElementById('field-' + field).classList.add('invalid');
  document.getElementById('err-' + field).textContent = text;
}

function validate(data) {
  let ok = true;
  if (!data.nom.trim()) { setError('nom', 'Le nom est requis.'); ok = false; }
  if (!data.email.trim()) { setError('email', "L'email est requis."); ok = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) { setError('email', 'Email invalide.'); ok = false; }
  if (!data.message.trim()) { setError('message', 'Le message est requis.'); ok = false; }
  return ok;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();
  statusMsg.textContent = '';

  const data = {
    nom: document.getElementById('nom').value,
    email: document.getElementById('email').value,
    message: document.getElementById('message').value,
  };

  if (!validate(data)) return;

  submitBtn.disabled = true;
  statusMsg.textContent = 'Envoi…';

  try {
    const res = await fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || 'Erreur inconnue.');
    }
    form.classList.add('hidden');
    confirmation.classList.add('visible');
  } catch (err) {
    statusMsg.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

resetBtn.addEventListener('click', () => {
  form.reset();
  form.classList.remove('hidden');
  confirmation.classList.remove('visible');
  statusMsg.textContent = '';
});
</script>
</body>
</html>
